<!-- bulletin_board/slideshow/templates/slideshow/slidedeck_list.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Slide Decks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
        }
        .list-group-item-action {
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4 text-center">Available Bulletin Boards</h1>
    <div class="list-group">
        {% for slidedeck in slidedecks %}
            <a href="{% url 'slidedeck_detail' slidedeck.slug %}" class="list-group-item list-group-item-action">
                {{ slidedeck.name }}
            </a>
        {% empty %}
            <div class="alert alert-warning" role="alert">
              No slide decks have been created yet. Go to the <a href="/admin">admin panel</a> to create one.
            </div>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
