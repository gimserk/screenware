<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ deck.name }}</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        .slide { display: none; width: 100vw; height: 100vh; object-fit: contain; }
        .slide.active { display: block; }
    </style>
</head>
<body>
    {% for slide in slides %}
    {% if slide.image %}
    <img src="{{ slide.image.url }}" class="slide {% if forloop.first %}active{% endif %}" data-duration="{{ slide.duration }}">
    {% endif %}
    {% endfor %}
    <script>
        const slides = document.querySelectorAll('.slide');
        let current = 0;
        function nextSlide() {
            if (!slides.length) return;
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
            let duration = parseInt(slides[current].getAttribute('data-duration') || '10') * 1000;
            setTimeout(nextSlide, duration);
        }
        if (slides.length > 0) {
            let duration = parseInt(slides[0].getAttribute('data-duration') || '10') * 1000;
            setTimeout(nextSlide, duration);
        }
    </script>
</body>
</html>
