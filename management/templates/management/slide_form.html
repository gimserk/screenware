{% extends "management/base.html" %}
{% block title %}Edit Slide | Screenware{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-slate-800 border border-slate-700 p-8 rounded-xl shadow-lg">
    <h1 class="text-xl font-bold text-white mb-6">Edit Slide: {{ slide.title }}</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Title</label>
            <input type="text" name="title" value="{{ form.title.value|default:'' }}" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Duration (Seconds)</label>
            <input type="number" name="duration" value="{{ form.duration.value|default:10 }}" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Order</label>
            <input type="number" name="order" value="{{ form.order.value|default:0 }}" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Image Asset</label>
            {% if slide.image %}<p class="text-xs text-slate-400 mb-1">Current: {{ slide.image.name }}</p>{% endif %}
            <input type="file" name="image" class="w-full text-xs text-slate-400">
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" name="active" id="active" {% if form.active.value %}checked{% endif %} class="rounded bg-slate-900">
            <label for="active" class="text-sm text-slate-300">Active</label>
        </div>
        <div class="flex justify-end gap-3 pt-4">
            <a href="{% url 'manage_slides' slide.deck.pk %}" class="bg-slate-700 px-4 py-2 rounded text-sm text-slate-300">Cancel</a>
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 px-5 py-2 rounded text-sm font-semibold text-white">Save</button>
        </div>
    </form>
</div>
{% endblock %}
