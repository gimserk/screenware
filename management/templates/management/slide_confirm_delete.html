{% extends 'management/base.html' %}

{% block title %}Confirm Delete Slide{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Confirm Deletion</h1>
</div>
<p>Are you sure you want to delete the slide: <strong>{{ object.title }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'manage_slides' object.slide_deck.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
