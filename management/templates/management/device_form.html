{% extends "management/base.html" %}
{% block title %}{{ title }} | Screenware{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-slate-800 border border-slate-700 p-8 rounded-xl shadow-lg">
    <h1 class="text-xl font-bold text-white mb-6">{{ title }}</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Friendly Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500 outline-none">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Device ID / Serial</label>
            <input type="text" name="device_id" value="{{ form.device_id.value|default:'' }}" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white font-mono text-sm focus:border-cyan-500 outline-none">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">MAC Address (Optional)</label>
            <input type="text" name="mac_address" value="{{ form.mac_address.value|default:'' }}" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white font-mono text-sm focus:border-cyan-500 outline-none">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Assigned Slide Deck</label>
            <select name="assigned_slidedeck" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500 outline-none">
                <option value="">---------</option>
                {% for deck in form.fields.assigned_slidedeck.queryset %}
                <option value="{{ deck.pk }}" {% if form.assigned_slidedeck.value == deck.pk %}selected{% endif %}>{{ deck.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex justify-end gap-3 pt-4">
            <a href="{% url 'device_list' %}" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm text-slate-300">Cancel</a>
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 px-5 py-2 rounded text-sm font-semibold text-white">Save</button>
        </div>
    </form>
</div>
{% endblock %}
