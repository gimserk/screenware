{% extends "management/base.html" %}
{% block title %}Delete Device | Screenware{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800 border border-slate-700 p-8 rounded-xl shadow text-center">
    <h1 class="text-xl font-bold text-white mb-2">Delete Device?</h1>
    <p class="text-sm text-slate-400 mb-6">Are you sure you want to remove <strong>{{ device.name }}</strong> ({{ device.device_id }})?</p>
    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'device_list' %}" class="bg-slate-700 px-4 py-2 rounded text-sm text-slate-300">Cancel</a>
        <button type="submit" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded text-sm font-semibold text-white">Confirm Delete</button>
    </form>
</div>
{% endblock %}
