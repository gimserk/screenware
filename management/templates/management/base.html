<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Project{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; padding: 48px 0 0; box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1); }
        .sidebar-sticky { padding-top: .5rem; }
        .nav-link { font-weight: 500; }
        .main-content { margin-left: 220px; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark fixed-top p-0 shadow">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="#">Screenware</a>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'manage_slidedeck_list' %}">Slide Decks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'manage_device_list' %}">Devices</a>
                    </li>
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'download_setup_script' %}">Download PI Setup</a>
                    </li>
                </ul>
                <hr>
                <ul class="nav flex-column">
                     <li class="nav-item">
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-link" style="padding: 0; border: none; background: none;">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="main-content col-md-9 ms-sm-auto col-lg-10 px-md-4">
            {% block content %}{% endblock %}

            <footer class="pt-4 my-md-5 pt-md-5 border-top text-center">
                <small class="d-block mb-3 text-muted">
                    &copy; {% now "Y" %} <a href="http://wyocyberrange.com" class="text-muted text-decoration-none">wyocyberrange.com</a>. Released under the <a href="https://opensource.org/licenses/MIT" class="text-muted text-decoration-none" target="_blank" rel="noopener noreferrer">MIT License</a>.
                </small>
            </footer>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}
{% endblock extra_js %}

</body>
</html>
