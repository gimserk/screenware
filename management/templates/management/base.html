<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Screenware{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-6">
            <a href="{% url 'dashboard' %}" class="text-xl font-bold text-cyan-400 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-tv"></i> SCREENWARE
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="text-sm font-medium hover:text-cyan-400 transition">Dashboard</a>
            <a href="{% url 'device_list' %}" class="text-sm font-medium hover:text-cyan-400 transition">Devices</a>
            <a href="{% url 'slidedeck_list' %}" class="text-sm font-medium hover:text-cyan-400 transition">Slide Decks</a>
            {% endif %}
        </div>
        <div>
            {% if user.is_authenticated %}
            <span class="text-xs text-slate-400 mr-4"><i class="fa-solid fa-user"></i> {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" class="text-xs bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded transition">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}" class="text-xs bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded transition">Login</a>
            {% endif %}
        </div>
    </nav>
    <main class="flex-grow container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Screenware Digital Signage &bull; Open Source
    </footer>
</body>
</html>
