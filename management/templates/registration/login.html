{% extends "management/base.html" %}
{% block title %}Login | Screenware{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800 border border-slate-700 p-8 rounded-xl shadow-lg mt-12">
    <h1 class="text-2xl font-bold text-center text-white mb-6">Screenware Sign In</h1>
    {% if form.errors %}
    <p class="text-xs bg-rose-900/50 border border-rose-700 text-rose-200 p-3 rounded mb-4 text-center">Invalid username or password.</p>
    {% endif %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Username</label>
            <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500 outline-none">
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-400 uppercase mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded font-bold text-white transition mt-2">Login</button>
    </form>
</div>
{% endblock %}
